[package]
name = "rebase"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "ReBase: single-source RON schema to generate UE5 C++ and Rust static data code."
repository = "https://example.com/rebase"
homepage = "https://example.com/rebase"
readme = "README.md"
keywords = ["unreal", "ue5", "codegen", "ron", "rust"]
categories = ["game-development", "development-tools", "data-structures"]

[features]
# Backends can be toggled; both enabled by default.
default = ["backend-ue", "backend-rust"]
backend-ue = []
backend-rust = []

# Optional: make validation stricter (may reject more inputs).
strict = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
walkdir = "2.5"
regex = "1.10"
heck = "0.5"

[[bin]]
name = "rebase"
path = "src/main.rs"
